[workspace]
members = ["apps/desktop/src-tauri"]
exclude = ["tools/spikes/tauri-python-sidecar"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
dbg_macro = "deny"
expect_used = "deny"
nursery = "deny"
panic = "deny"
pedantic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
