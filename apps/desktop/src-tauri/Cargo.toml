[package]
name = "rino-desktop"
version = "0.0.0"
description = "Rino desktop application"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "rino_desktop_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = { version = "=3.0.0", features = ["signature"] }
getrandom = "=0.4.3"
jsonschema = { version = "=0.49.2", default-features = false }
keyring = "=4.1.6"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", default-features = false, features = ["wry"] }
tauri-plugin-dialog = "=2.7.2"
uuid = { version = "=1.24.0", features = ["v4", "v5"] }
zip = { version = "=8.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[lints]
workspace = true
