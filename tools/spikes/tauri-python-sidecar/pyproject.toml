[project]
name = "rino-sidecar-packaging-spike"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = ["pyinstaller==6.21.0"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.pyright]
include = ["sidecar/runtime_sidecar.py"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = "error"
